name: geo_test
channels:
  - conda-forge
  - https://repo.anaconda.com/pkgs/main
  - https://repo.anaconda.com/pkgs/r
  - https://repo.anaconda.com/pkgs/msys2
dependencies:
  - python=3.12
  - geopandas
  - shapely
  - pyproj
  - rtree
  - fiona
  - scikit-mobility
  - osmnx
  - numpy
  - pandas=2.3.3 # pandas version < 3 required by scikit-mobility 1.3.1, otherwise the 'stay_detection' function breaks.
  - notebook
  - ipykernel
  - pyarrow
  - plotly
  - numba
