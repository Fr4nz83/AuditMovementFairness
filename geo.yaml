name: geo
channels:
  - conda-forge
  - https://repo.anaconda.com/pkgs/main
  - https://repo.anaconda.com/pkgs/r
  - https://repo.anaconda.com/pkgs/msys2
dependencies:
  - python=3.12
  - geopandas
  - geos
  - shapely
  - pyproj
  - rtree
  - fiona
  - scikit-mobility
  - osmnx
  - numpy
  - pandas
  - jupyterlab
  - ipykernel
  - pyarrow
  - plotly
prefix: D:\miniconda3\envs\geo
